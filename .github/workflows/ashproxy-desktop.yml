name: ashproxy desktop
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build portable desktop core
        shell: msys2 {0}
        working-directory: .
        run: |
          cp Makefile.win src/Makefile.var
          make -C src -j4 OPENSSL_CHECK=false PCRE_CHECK=false EXTRA_CFLAGS=-DASHPROXY_DESKTOP ../bin/3proxy.exe
          mkdir -p desktop/core
          cp bin/3proxy.exe desktop/core/
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
      - run: npm ci
        working-directory: desktop/frontend
      - run: npm run build
        working-directory: desktop/frontend
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags '-s -w -H=windowsgui' -o ashproxy.exe .
      - name: Package Windows build
        run: ../scripts/package-desktop.ps1 -OutputDirectory ../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ashproxy-windows-amd64
          path: artifacts/
